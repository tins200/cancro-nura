name: build-cancro

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          df -h / || true
          nproc
          free -h
          ls /proc/sys/fs/binfmt_misc/ | head -10

      - name: 安装 pmbootstrap (Nura main 分支)
        run: |
          python3 -m pip install --user "git+https://gitlab.nura.eco/nura/pmbootstrap.git@main"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pmbootstrap --version

      - name: 准备 pmaports + 原地覆盖 cancro 包为 armv7 版
        run: |
          P=$HOME/.local/var/pmbootstrap/cache_git
          mkdir -p $P
          git clone https://gitlab.postmarketos.org/postmarketOS/pmaports.git $P/pmaports
          rm -rf $P/pmaports/device/archived/device-xiaomi-cancro \
                 $P/pmaports/device/archived/linux-xiaomi-cancro
          cp -r "$GITHUB_WORKSPACE/device-xiaomi-cancro" $P/pmaports/device/archived/
          cp -r "$GITHUB_WORKSPACE/linux-xiaomi-cancro"  $P/pmaports/device/archived/
          # 仓库里的 3 个补丁是符号链接的文本残留, 用真实共享补丁替换
          for f in 02_gpu-msm-fix-gcc5-compile.patch \
                   gcc10-extern_YYLOC_global_declaration.patch \
                   linux3.4-ARM-8933-1-replace-Sun-Solaris-style-flag-on-section.patch; do
            if [ -f "$P/pmaports/device/.shared-patches/linux/$f" ]; then
              cp "$P/pmaports/device/.shared-patches/linux/$f" \
                 "$P/pmaports/device/archived/linux-xiaomi-cancro/$f"
              echo "替换共享补丁: $f"
            else
              echo "警告: 共享补丁不存在: $f"
            fi
          done
          grep -H "^arch=" $P/pmaports/device/archived/device-xiaomi-cancro/APKBUILD \
                           $P/pmaports/device/archived/linux-xiaomi-cancro/APKBUILD

      - name: 下载内核源码包并校验 sha512
        run: |
          T=linux-xiaomi-cancro-b263a8914dcb8f9609be55070c3e40c85020188d.tar.gz
          curl -fsSL -o "$T" \
            "https://github.com/tins200/cancro-nura/releases/download/v1/$T"
          echo "f24bf599d5a4de3729ceea6a558013a71b550ae772968928cc0825115665a267f65cb16c3b69ed3223e069886c7a1ca16bd0a754cc081accda2ce34fec3b1b58  $T" | sha512sum -c -
          # v3 distfiles 可能在 workdir 或用户级缓存, 两处都放
          mkdir -p "$HOME/pmwork/cache_distfiles" "$HOME/.local/var/pmbootstrap/cache_distfiles"
          cp "$T" "$HOME/pmwork/cache_distfiles/"
          cp "$T" "$HOME/.local/var/pmbootstrap/cache_distfiles/"
          find "$HOME/.local/var/pmbootstrap" -maxdepth 2 -type d | head -10

      - name: pmbootstrap init (管道喂预设答案)
        run: |
          printf '\n\n\nxiaomi\ncancro\ny\n' > /tmp/answers.txt
          yes '' | head -60 >> /tmp/answers.txt
          pmbootstrap -w "$HOME/pmwork" init < /tmp/answers.txt 2>&1 | tail -80
          echo "--- 生成的配置 ---"
          find "$HOME/.config" -name "pmpconfig" -exec cat {} \; 2>/dev/null | head -40
          echo "--- 重新生成源码校验和 (修正 archived 陈旧 sha) ---"
          pmbootstrap -w "$HOME/pmwork" checksum linux-xiaomi-cancro
          pmbootstrap -w "$HOME/pmwork" checksum device-xiaomi-cancro

      - name: 构建镜像 (gcc6 + 3.4 内核, 约 1-3 小时)
        run: |
          df -h /
          pmbootstrap -w "$HOME/pmwork" --details-to-stdout install --password 147147
          df -h /

      - name: 失败时导出构建日志
        if: failure()
        run: |
          echo "=== pmwork/log.txt 尾部 ==="
          tail -400 "$HOME/pmwork/log.txt" || echo "log.txt 不存在"
          echo "=== dmesg OOM 线索 ==="
          (dmesg 2>/dev/null || sudo dmesg 2>/dev/null) | grep -iE "killed|oom|out of memory" | tail -10
          echo "=== 内存 ==="
          free -h
          echo "=== pmwork 目录 ==="
          ls "$HOME/pmwork" 2>/dev/null | head -20

      - name: 导出产物
        run: |
          mkdir -p out
          find $HOME/pmwork/chroot_native/home/pmos/rootfs -maxdepth 1 -name "*.img" \
            -exec cp -v {} out/ \;
          ls -la out/
          [ -n "$(ls -A out 2>/dev/null)" ] || { echo "没有 img 产物!"; exit 1; }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: cancro-images
          path: out/
          retention-days: 30

      - name: 单独导出 boot.img(小体积, 便于直接下载)
        if: always()
        run: |
          set -x
          IMG=$(ls out/*.img | head -1) || exit 0
          LOOP=$(sudo losetup -Pf --show "$IMG")
          sudo partx -u "$LOOP" || true
          sleep 2
          ls -l ${LOOP}* || true
          sudo mkdir -p /mnt/bp
          for p in ${LOOP}p1 ${LOOP}p2; do
            if sudo mount -o ro "$p" /mnt/bp 2>/dev/null; then
              if sudo test -f /mnt/bp/boot.img; then
                sudo cp /mnt/bp/boot.img out/boot-cancro.img
                echo "found boot.img on $p"
              fi
              sudo umount /mnt/bp || true
            fi
          done
          sudo losetup -d "$LOOP" || true
          ls -l out/ || true

      - name: 上传 boot.img(小产物)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cancro-boot
          path: out/boot-cancro.img
          retention-days: 30
          if-no-files-found: warn
