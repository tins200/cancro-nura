name: build-cancro

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          df -h / || true
          nproc
          free -h
          ls /proc/sys/fs/binfmt_misc/ | head -10

      - name: 安装 pmbootstrap (Nura main 分支)
        run: |
          python3 -m pip install --user "git+https://gitlab.nura.eco/nura/pmbootstrap.git@main"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pmbootstrap --version

      - name: 准备 pmaports + 放入 cancro 设备包 (armv7 改造版)
        run: |
          P=$HOME/.local/var/pmbootstrap/cache_git
          mkdir -p $P
          git clone https://gitlab.nura.eco/nura/pmaports.git $P/pmaports
          cp -r "$GITHUB_WORKSPACE/device-xiaomi-cancro" $P/pmaports/device/testing/
          cp -r "$GITHUB_WORKSPACE/linux-xiaomi-cancro"  $P/pmaports/device/testing/
          grep -H "^arch=" $P/pmaports/device/testing/device-xiaomi-cancro/APKBUILD \
                          $P/pmaports/device/testing/linux-xiaomi-cancro/APKBUILD

      - name: 下载内核源码包并校验 sha512
        run: |
          T=linux-xiaomi-cancro-b263a8914dcb8f9609be55070c3e40c85020188d.tar.gz
          curl -fsSL -o "$T" \
            "https://github.com/tins200/cancro-nura/releases/download/v1/$T"
          echo "f24bf599d5a4de3729ceea6a558013a71b550ae772968928cc0825115665a267f65cb16c3b69ed3223e069886c7a1ca16bd0a754cc081accda2ce34fec3b1b58  $T" | sha512sum -c -
          # v3 distfiles 可能在 workdir 或用户级缓存, 两处都放
          mkdir -p "$HOME/pmwork/cache_distfiles" "$HOME/.local/var/pmbootstrap/cache_distfiles"
          cp "$T" "$HOME/pmwork/cache_distfiles/"
          cp "$T" "$HOME/.local/var/pmbootstrap/cache_distfiles/"
          find "$HOME/.local/var/pmbootstrap" -maxdepth 2 -type d | head -10

      - name: pmbootstrap 非交互配置
        run: |
          PM() { pmbootstrap -w "$HOME/pmwork" "$@"; }
          PM config vendor xiaomi || true
          PM config device xiaomi-cancro || true
          PM config kernel downstream || true
          PM config ui none || true
          PM config user pmos || true
          PM config timezone Asia/Shanghai || true
          PM config || true

      - name: 构建镜像 (gcc6 + 3.4 内核, 约 1-3 小时)
        run: |
          df -h /
          pmbootstrap -w "$HOME/pmwork" install
          df -h /

      - name: 导出产物
        run: |
          mkdir -p out
          find $HOME/pmwork/chroot_native/home/pmos/rootfs -maxdepth 1 -name "*.img" \
            -exec cp -v {} out/ \;
          ls -la out/
          [ -n "$(ls -A out 2>/dev/null)" ] || { echo "没有 img 产物!"; exit 1; }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: cancro-images
          path: out/
          retention-days: 30
